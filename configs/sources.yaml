# Источники для grabber'а.
# domain: молдавское законодательство на русском языке.
# Источник: legis.md (официальный портал Парламента РМ, Государственный реестр
# юридических документов). Сайт — SPA, текст документа подгружается через JS,
# поэтому берём его через PDF, который сайт официально даёт скачивать.
#
# doc_id — внутренний идентификатор документа на legis.md, виден в URL вида
# .../cautare/getResults?doc_id=XXXXX&lang=ru при открытии документа.
# Ниже — стартовый список, можно дополнять по мере необходимости.

legis_md:
  documents:
    - doc_id: 112573
      title: "Гражданский кодекс Республики Молдова № 1107-XV от 06.06.2002"
      source_id: "gk_md"
    # TODO: добавить doc_id для Трудового кодекса, Конституции и др. —
    # найти через поиск на legis.md аналогично Гражданскому кодексу.

output:
  raw_dir: "data/raw"
  manifest_path: "data/manifest.json"